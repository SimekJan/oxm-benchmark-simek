databaseToUse:
  - neo4j

generator:
  outputDir: /data
  keepData: true
  dataSeed: 1234567890
  dataSize: small
  dataCardinality: light

importer:
  mongo:
    connection: mongodb://mongo:27017
    db_name: oxm_benchmark
  neo4j:
    connection: bolt://neo4j:7687
    username: neo4j
    password: oxm_password
  postgres:
    connection: jdbc:postgresql://postgres:5432/oxm_benchmark
    username: postgres
    password: oxm_password
