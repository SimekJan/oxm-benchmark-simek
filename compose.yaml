services:

  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    command: mongod --quiet --logpath /dev/null

  generator:
    build: .
    command:
      - cs.mff.uk.simek.generator.Generator
    environment:
      CONFIG_FILE: /oxm_config.yaml
    volumes:
      - ./data:/data
      - ./oxm_config.yaml:/oxm_config.yaml:ro

  importer:
    build: .
    command:
      - -Dorg.slf4j.simpleLogger.defaultLogLevel=warn
      - cs.mff.uk.simek.importer.Importer
    environment:
      CONFIG_FILE: /oxm_config.yaml
    volumes:
      - ./data:/data
      - ./oxm_config.yaml:/oxm_config.yaml:ro
    depends_on:
      generator:
        condition: service_completed_successfully
      mongo:
        condition: service_started

  runner:
    build: .
    command:
      - cs.mff.uk.simek.runner.Runner
    environment:
      CONFIG_FILE: /oxm_config.yaml
    volumes:
      - ./oxm_config.yaml:/oxm_config.yaml:ro
    depends_on:
      importer:
        condition: service_completed_successfully

volumes:
  mongo-data:
