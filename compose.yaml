services:

  mongo:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    command: mongod --quiet --logpath /dev/null
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  neo4j:
    image: neo4j:2026.09.0
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/oxm_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p oxm_password 'RETURN 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:18.6
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: oxm_password
      POSTGRES_DB: oxm_benchmark
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d oxm_benchmark" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  generator:
    build: .
    command:
      - cs.mff.uk.simek.generator.Generator
    environment:
      CONFIG_FILE: /oxm_config.yaml
    volumes:
      - ./data:/data
      - ./oxm_config.yaml:/oxm_config.yaml:ro

  importer:
    build: .
    command:
      - -Dorg.slf4j.simpleLogger.defaultLogLevel=warn
      - cs.mff.uk.simek.importer.Importer
    environment:
      CONFIG_FILE: /oxm_config.yaml
    volumes:
      - ./data:/data
      - ./oxm_config.yaml:/oxm_config.yaml:ro
    depends_on:
      generator:
        condition: service_completed_successfully

  runner:
    build: .
    command:
      - cs.mff.uk.simek.runner.Runner
    environment:
      CONFIG_FILE: /oxm_config.yaml
    volumes:
      - ./data:/data
      - ./oxm_config.yaml:/oxm_config.yaml:ro
    depends_on:
      importer:
        condition: service_completed_successfully

volumes:
  mongo-data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
